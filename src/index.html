<!doctype html>
<html lang="en">

    <meta

    <title>Moyo header</title>
    <link

          <li>

            </a>

          <li>

          </li>
          <li>

              Gadgets
            </a>

          <li>
            <a
              href="tablets.html"
              class="link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
